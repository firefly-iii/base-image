name: Issues - Transfer issues
on:
  issues:
    types:
      - labeled
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer
        uses: lando/transfer-issue-action@6cf14bfdd14bae08711cd96787826dfa037c0186  # v2.1.0
        with:
          token: ${{ secrets.TRANSFER_ISSUE_TOKEN }}
          router: move:firefly-iii
          create_stub: false
